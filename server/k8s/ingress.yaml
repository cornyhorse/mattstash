# Optional: Ingress for access from outside the cluster, with TLS.
# Requires an ingress controller (ingress-nginx shown; adapt the annotations for others) and a
# TLS certificate in the `mattstash-tls-cert` Secret (cert-manager can create it).
#
# The controller is the TLS terminator: traffic from the controller to the pod is plain HTTP on the
# cluster network (the pod stays reachable only through networkpolicy.yaml - remember to allow the
# controller's namespace there).
#
# Rate limiting and trusted proxies
#   * The server throttles repeated failed authentication per client IP, and applies a global
#     per-IP request ceiling. Behind an ingress controller the TCP peer of every request is the
#     controller, so by default ALL clients would share one bucket. Tell the server how many proxy
#     hops to trust by setting MATTSTASH_TRUSTED_PROXY_HOPS=1 (ConfigMap) when this ingress
#     controller is the only proxy in front of the pods; use a higher number only for a chain of
#     proxies you control. Never set it when clients can reach the pods directly, because then a
#     client can forge X-Forwarded-For and dodge the limits.
#   * Add limits at the ingress too as a first line of defence (annotations below).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mattstash-api
  namespace: mattstash
  annotations:
    # ingress-nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    # The API only handles small JSON bodies.
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Per-client-IP limits at the edge (requests per second / concurrent connections). Tune to your
    # clients; the server's own limits are the second line.
    nginx.ingress.kubernetes.io/limit-rps: "10"
    nginx.ingress.kubernetes.io/limit-connections: "20"
spec:
  ingressClassName: nginx # adjust to your ingress controller
  tls:
    - hosts:
        - mattstash.example.com # replace with your domain
      secretName: mattstash-tls-cert
  rules:
    - host: mattstash.example.com # replace with your domain
      http:
        paths:
          # Only /api is exposed (v1 API, /api/health, /api/ready). The bare /health and /ready
          # probe endpoints stay cluster-internal.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: mattstash-api
                port:
                  name: http
