# TEMPLATE ONLY - do not fill this file in and commit it, and do not `kubectl apply` it as it is.
#
# A Kubernetes Secret is base64, not encryption: anyone who can read the manifest (git history,
# CI logs, a backup of this directory) can read the values. Get the real values into the cluster
# some other way ("secret zero"):
#
#   * Create them imperatively from files kept outside the repository (commands below), or
#   * keep only an ENCRYPTED form in git: Sealed Secrets (kubeseal), SOPS + age/KMS, or
#   * do not store them in git at all: External Secrets Operator or the Secrets Store CSI driver,
#     syncing from Vault / AWS Secrets Manager / GCP Secret Manager / Azure Key Vault.
#
# Also: enable encryption at rest for Secrets in etcd, and restrict `get`/`list`/`watch` on
# secrets in this namespace with RBAC (anyone who can read them can read your master password and
# API keys; anyone who can `exec` into the pod can too).
#
# The placeholders below are deliberately INVALID: CHANGE-ME is shorter than the 32-character API
# key minimum, so a pod started from an unedited copy refuses to start instead of running with a
# guessable key.
#
# --------------------------------------------------------------------------------------------
# Real values - two separate Secrets, mounted at two separate paths:
#
#   mattstash-secrets  master password + API keys  -> /secrets
#   mattstash-db       the KeePass database        -> /data   (read-only deployment only)
#
# 1. API keys (>= 32 characters each; one per line, or a JSON policy file, see
#    docs/configuration.md) and the master password. Generate keys with:
#       openssl rand -base64 32
#
#    kubectl -n mattstash create secret generic mattstash-secrets \
#      --from-file=kdbx-password=./kdbx_password.txt \
#      --from-file=api-keys=./api_keys.txt
#
# 2. The database (created locally with `mattstash setup`; the server never creates one).
#    A Secret holds at most 1 MiB, base64 included, i.e. roughly 700 KiB of .kdbx - plenty for
#    thousands of entries. Bigger databases, or write mode, use the PVC in writable/ instead.
#
#    kubectl -n mattstash create secret generic mattstash-db \
#      --from-file=mattstash.kdbx=./mattstash.kdbx
#
# Updating the database later: re-create the Secret (`kubectl create secret ... --dry-run=client
# -o yaml | kubectl apply -f -`). Within about a minute the kubelet swaps the file in every pod
# and the server notices the change on its next poll (MATTSTASH_DB_POLL_INTERVAL) and reloads it,
# so no restart is needed. Do NOT mount the secret with `subPath`: subPath mounts are never
# updated.
# --------------------------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: mattstash-secrets
  namespace: mattstash
type: Opaque
stringData:
  # The KeePass master password (what `mattstash setup` was given).
  kdbx-password: "CHANGE-ME"
  # One API key per line, each at least 32 characters (openssl rand -base64 32).
  api-keys: |
    CHANGE-ME
