# Non-secret settings only. The KeePass database and the credentials live in Secrets (read-only
# deployment: see secret.example.yaml) or on a PersistentVolumeClaim (writable deployment: see
# writable/). A ConfigMap is neither secret-class nor able to hold a database larger than 1 MiB,
# so the database is no longer stored here.
#
# MATTSTASH_ALLOW_WRITES is set per Deployment (false in deployment.yaml, true in
# writable/deployment.yaml) so the mode is visible next to the volumes it depends on.
apiVersion: v1
kind: ConfigMap
metadata:
  name: mattstash-config
  namespace: mattstash
data:
  MATTSTASH_DB_PATH: "/data/mattstash.kdbx"
  # The master password and the policy file (principals, token hashes, grants) are files from the separate
  # /secrets mount (never env values). The policy file is REQUIRED: the server does not start without one
  # (MATTSTASH_API_KEY / MATTSTASH_API_KEYS_FILE were removed in 0.3; see docs/upgrading-to-0.3.md).
  KDBX_PASSWORD_FILE: "/secrets/kdbx-password"
  MATTSTASH_POLICY_FILE: "/secrets/policy.json"
  MATTSTASH_LOG_LEVEL: "info"
  MATTSTASH_RATE_LIMIT: "100/minute"
  # Do not serve the OpenAPI / Swagger pages.
  MATTSTASH_DISABLE_DOCS: "true"
  # How often (seconds) the server checks the database file for external changes. This is how a
  # rolling update of the db Secret is picked up without restarting the pods. 0 disables polling.
  MATTSTASH_DB_POLL_INTERVAL: "5"
  # Number of trusted reverse-proxy hops in front of the pods (see ingress.yaml). Leave unset (0)
  # unless ALL traffic arrives through proxies you control; with 1, the ingress controller is the
  # only hop and the client IP is taken from X-Forwarded-For. Without it, every client behind the
  # ingress shares one rate-limit bucket (the controller's IP).
  # MATTSTASH_TRUSTED_PROXY_HOPS: "1"
