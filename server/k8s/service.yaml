# ClusterIP only. External access, if any, goes through ingress.yaml (TLS) - never NodePort or
# LoadBalancer for this service. Which pods may connect is decided by networkpolicy.yaml.
# The same Service fronts either the read-only or the writable Deployment (same labels).
apiVersion: v1
kind: Service
metadata:
  name: mattstash-api
  namespace: mattstash
  labels:
    app: mattstash-api
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: mattstash-api
