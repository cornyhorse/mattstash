name: Auto Release

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual re-runs

# Prevent concurrent releases
concurrency:
  group: release
  cancel-in-progress: false

# No permissions by default. Every job below asks for exactly what it needs.
permissions: {}

# Third-party actions are pinned to a commit SHA (the comment is the tag it was resolved from).
# Dependabot (.github/dependabot.yml) keeps both up to date.

jobs:
  # Wait for the CI workflow to pass before releasing
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [ci]
    runs-on: ubuntu-latest
    environment: pypi
    # Skip if the commit was made by the release bot (prevents infinite loop)
    if: "!contains(github.event.head_commit.message, '[skip-release]')"
    permissions:
      contents: write  # push the version-bump commit and tag, create the GitHub Release
      # id-token: write  # <- needed for PyPI trusted publishing, see "Publish to PyPI" below
    outputs:
      new_version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # Use the default GITHUB_TOKEN - needs "Allow GitHub Actions to
          # create and approve pull requests" enabled in repo settings, and
          # the default token permissions set to read/write. The token is kept
          # (persist-credentials defaults to true) because the version bump is pushed below.
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine bump type
        id: bump
        env:
          # The commit message is attacker-influenced text. It is handed to the shell through the
          # environment and only ever read as "$COMMIT_MSG"; it must never be interpolated into the
          # script with ${{ }} (that would be script injection in the job that holds the publish
          # credentials).
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Check for explicit bump directives in merge commit message
          if printf '%s\n' "$COMMIT_MSG" | grep -qiE '\[(major|bump-major)\]'; then
            bump_type="major"
          elif printf '%s\n' "$COMMIT_MSG" | grep -qiE '\[(minor|bump-minor)\]'; then
            bump_type="minor"
          else
            bump_type="patch"
          fi
          echo "type=$bump_type" >> "$GITHUB_OUTPUT"
          echo "Bump type: $bump_type"

      - name: Bump version
        id: version
        run: |
          python - <<'PYEOF'
          import re, os, sys

          bump_type = os.environ["BUMP_TYPE"]

          with open("pyproject.toml") as f:
              content = f.read()

          m = re.search(r'version\s*=\s*"(\d+)\.(\d+)\.(\d+)"', content)
          if not m:
              print("ERROR: Could not find version in pyproject.toml")
              sys.exit(1)

          major, minor, patch = int(m.group(1)), int(m.group(2)), int(m.group(3))
          old_version = f"{major}.{minor}.{patch}"

          if bump_type == "major":
              major += 1
              minor = 0
              patch = 0
          elif bump_type == "minor":
              minor += 1
              patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          content = content.replace(f'version = "{old_version}"', f'version = "{new_version}"')

          with open("pyproject.toml", "w") as f:
              f.write(content)

          print(f"Bumped {old_version} -> {new_version} ({bump_type})")

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"old_version={old_version}\n")
              f.write(f"new_version={new_version}\n")
              f.write(f"tag=v{new_version}\n")
          PYEOF
        env:
          BUMP_TYPE: ${{ steps.bump.outputs.type }}

      - name: Commit version bump
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
        run: |
          git add pyproject.toml
          git commit -m "release: v${NEW_VERSION} [skip-release]"
          git tag "v${NEW_VERSION}"
          git push origin main --tags

      - name: Install build tools
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Build package
        run: python -m build

      # --- Publish to PyPI ------------------------------------------------------------------
      # ACTIVE: token-based publishing with the long-lived PYPI_API_TOKEN secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true

      # READY TO ENABLE: PyPI trusted publishing (OIDC). No stored token to leak or rotate, and
      # the publish is bound to this repository, workflow and environment. It needs a ONE-TIME
      # setting on PyPI first (repository owner action):
      #   1. pypi.org -> project "mattstash" -> Settings -> Publishing -> add a trusted publisher:
      #      GitHub, owner "cornyhorse", repository "mattstash", workflow "release.yml",
      #      environment "pypi".
      #   2. Then, in this file: uncomment `id-token: write` in this job's `permissions`, delete the
      #      token-based "Publish to PyPI" step above, uncomment the step below, and finally delete
      #      the PYPI_API_TOKEN secret.
      # - name: Publish to PyPI (trusted publishing)
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      #   with:
      #     print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: "v${{ steps.version.outputs.new_version }}"
          name: "v${{ steps.version.outputs.new_version }}"
          body: |
            ## mattstash v${{ steps.version.outputs.new_version }}

            Bumped from v${{ steps.version.outputs.old_version }} → v${{ steps.version.outputs.new_version }} (${{ steps.bump.outputs.type }}).

            Install or upgrade:
            ```
            pip install mattstash==${{ steps.version.outputs.new_version }}
            ```
          generate_release_notes: true

  docker:
    needs: [release]
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip-release]')"
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io

    steps:
      # Build exactly the commit that was just released (the version-bump commit the release job
      # tagged), not whatever main happens to be by now. The image installs the library from this
      # checkout, so image == tagged commit == PyPI release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Repository root as the build context, so the image is built from this commit's library.
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Supply-chain metadata attached to the image in the registry (SLSA provenance and an
          # SPDX SBOM, as BuildKit attestations).
          provenance: true
          sbom: true
          tags: |
            ghcr.io/cornyhorse/mattstash:latest
            ghcr.io/cornyhorse/mattstash:v${{ needs.release.outputs.new_version }}
          labels: |
            org.opencontainers.image.source=https://github.com/cornyhorse/mattstash
            org.opencontainers.image.description=MattStash API Server
            org.opencontainers.image.version=${{ needs.release.outputs.new_version }}
            org.opencontainers.image.licenses=MIT
