name: Release

# Releases are manual. Merging to main publishes nothing.
#
# To release: bump `version` in pyproject.toml in a pull request, merge it, then push a tag vX.Y.Z on the
# merge commit (the runbook is .claude/skills/release/SKILL.md; `scripts/check-release.sh vX.Y.Z --preflight`
# checks everything the workflow below will check). Pushing the tag starts this workflow.
#
# To re-run a failed publish for an EXISTING tag: Actions -> Release -> "Run workflow" and pick the tag as the
# ref ("Use workflow from: Tag: vX.Y.Z"). Never move or delete a tag that was already published.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

# One release at a time; a second one waits instead of being cancelled halfway.
concurrency:
  group: release
  cancel-in-progress: false

# No permissions by default. Every job below asks for exactly what it needs.
permissions: {}

# Third-party actions are pinned to a commit SHA (the comment is the tag it was resolved from).
# Dependabot (.github/dependabot.yml) keeps both up to date.

jobs:
  # Cheap checks first, with no credentials in reach: refuse anything that is not a clean release tag.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Require a tag
        id: tag
        env:
          # Handed to the shell through the environment only, never interpolated into the script.
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_TYPE" != "tag" ]]; then
            echo "::error::Run this workflow from a tag (Use workflow from: Tag: vX.Y.Z), not from the branch '$REF_NAME'."
            exit 1
          fi
          if [[ ! "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$REF_NAME' is not a release tag (vMAJOR.MINOR.PATCH)."
            exit 1
          fi
          echo "tag=$REF_NAME" >> "$GITHUB_OUTPUT"
          echo "version=${REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0  # the check needs the history of main
          persist-credentials: false

      - name: Check the tag against pyproject.toml and main
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: bash scripts/check-release.sh "$TAG"

  # The same checks as every pull request, on exactly the tagged commit.
  ci:
    needs: [verify]
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: [verify, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Optional approval gate: add required reviewers to the "pypi" environment (Settings -> Environments) and
    # every release waits for a click before anything is published.
    environment: pypi
    permissions:
      contents: write  # create the GitHub Release for the tag (nothing is pushed)
      # id-token: write  # <- needed for PyPI trusted publishing, see "Publish to PyPI" below
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install build
          python -m build

      # --- Publish to PyPI ------------------------------------------------------------------
      # ACTIVE: token-based publishing with the long-lived PYPI_API_TOKEN secret.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          print-hash: true

      # READY TO ENABLE: PyPI trusted publishing (OIDC). No stored token to leak or rotate, and
      # the publish is bound to this repository, workflow and environment. It needs a ONE-TIME
      # setting on PyPI first (repository owner action):
      #   1. pypi.org -> project "mattstash" -> Settings -> Publishing -> add a trusted publisher:
      #      GitHub, owner "cornyhorse", repository "mattstash", workflow "release.yml",
      #      environment "pypi".
      #   2. Then, in this file: uncomment `id-token: write` in this job's `permissions`, delete the
      #      token-based "Publish to PyPI" step above, uncomment the step below, and finally delete
      #      the PYPI_API_TOKEN secret.
      # - name: Publish to PyPI (trusted publishing)
      #   uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      #   with:
      #     print-hash: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ needs.verify.outputs.tag }}
          name: ${{ needs.verify.outputs.tag }}
          body: |
            ## mattstash ${{ needs.verify.outputs.tag }}

            Install or upgrade:
            ```
            pip install mattstash==${{ needs.verify.outputs.version }}
            ```

            Server image: `ghcr.io/cornyhorse/mattstash:${{ needs.verify.outputs.tag }}`
          generate_release_notes: true

  docker:
    needs: [verify, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write  # push the image to ghcr.io
    steps:
      # Build exactly the tagged commit. The image installs the library from this checkout, so
      # image == tagged commit == PyPI release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: refs/tags/${{ needs.verify.outputs.tag }}
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          # Repository root as the build context, so the image is built from this commit's library.
          context: .
          file: server/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          # Supply-chain metadata attached to the image in the registry (SLSA provenance and an
          # SPDX SBOM, as BuildKit attestations).
          provenance: true
          sbom: true
          tags: |
            ghcr.io/cornyhorse/mattstash:latest
            ghcr.io/cornyhorse/mattstash:${{ needs.verify.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/cornyhorse/mattstash
            org.opencontainers.image.description=MattStash API Server
            org.opencontainers.image.version=${{ needs.verify.outputs.version }}
            org.opencontainers.image.licenses=MIT
