name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_call:  # allow release.yml to call this workflow

# Least privilege: nothing in CI needs more than read access to the repository.
permissions:
  contents: read

# Third-party actions are pinned to a commit SHA (the comment is the tag it was resolved from).
# Dependabot (.github/dependabot.yml) keeps both up to date.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

  lint-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install ruff
        run: pip install ruff

      - name: Ruff check (server)
        run: ruff check server/app server/tests

      - name: Ruff format check (server)
        run: ruff format --check server/app server/tests

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all]"
          pip install pytest pytest-cov "mypy==1.19.1"

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/integration -q --tb=short

      - name: Type check
        if: matrix.python-version == '3.12'
        run: python -m mypy src/mattstash/ --strict

  # The API server's own test suite (server/tests), including the coverage gate configured in
  # server/pytest.ini. Runs on the Python version the Docker image uses.
  server-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Server runtime dependencies exactly as the Docker image installs them (hash-pinned):
          # this also proves the lockfile installs and works.
          pip install --require-hashes -r server/requirements.lock
          # The library from this checkout, test tooling, and the server's own test requirements.
          pip install -e ".[all,dev]" -r server/requirements-dev.txt

      - name: Run server tests
        working-directory: server
        run: python -m pytest

  # Integration tests (CLI workflows; the Docker-based server tests skip themselves when Docker or
  # docker-compose is not available).
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[all,dev]"

      - name: Run integration tests
        run: python -m pytest tests/integration -q --tb=short

  # Known-vulnerability scan of what we ship (server lockfile) and of the library's own
  # dependency tree. pip-audit lives in its own virtualenv so it does not audit itself.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install pip-audit (isolated)
        run: |
          python -m venv "$RUNNER_TEMP/audit-venv"
          "$RUNNER_TEMP/audit-venv/bin/pip" install --upgrade pip pip-audit

      - name: Audit server lockfile
        # The lockfile is fully hash-pinned, so no dependency resolution is needed.
        run: >
          "$RUNNER_TEMP/audit-venv/bin/pip-audit"
          -r server/requirements.lock --disable-pip --require-hashes

      - name: Install the library with all extras (fresh virtualenv)
        run: |
          python -m venv "$RUNNER_TEMP/lib-venv"
          "$RUNNER_TEMP/lib-venv/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/lib-venv/bin/pip" install ".[all]"

      - name: Audit installed library dependencies
        run: |
          "$RUNNER_TEMP/audit-venv/bin/pip-audit" \
            --path "$("$RUNNER_TEMP/lib-venv/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')"

  # Single status check that branch protection can gate on.
  # This rolls up all jobs (including the matrix) into one required job.
  ci-gate:
    if: always()
    needs: [lint, lint-server, test, server-tests, integration, audit]
    runs-on: ubuntu-latest
    steps:
      - name: Check results
        env:
          LINT: ${{ needs.lint.result }}
          LINT_SERVER: ${{ needs.lint-server.result }}
          TEST: ${{ needs.test.result }}
          SERVER_TESTS: ${{ needs.server-tests.result }}
          INTEGRATION: ${{ needs.integration.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          failed=0
          for pair in "lint:$LINT" "lint-server:$LINT_SERVER" "test:$TEST" \
                      "server-tests:$SERVER_TESTS" "integration:$INTEGRATION" "audit:$AUDIT"; do
            name="${pair%%:*}"
            result="${pair#*:}"
            if [[ "$result" != "success" ]]; then
              echo "::error::Job '$name' finished with result '$result' (failed or cancelled)."
              failed=1
            fi
          done
          if [[ "$failed" -ne 0 ]]; then
            exit 1
          fi
          echo "All checks passed."
